<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presence Checker – Prototype</title>
<style>
:root{--bg:#eef2f4;--card:#fff;--ink:#14292f;--mute:#5b6f76;--line:#d5dee2;--brand:#0f5c6e;--on:#fff;--ok:#1b7a43;--okbg:#dff2e6;--late:#8a5a00;--latebg:#fdf0c9;--abs:#a3262a;--absbg:#fbe0e0}
@media (prefers-color-scheme:dark){:root{--bg:#0e1a1e;--card:#16262b;--ink:#e6eff2;--mute:#9bb0b7;--line:#2a3f46;--brand:#5cc3d9;--on:#06242b;--ok:#6fd597;--okbg:#173a27;--late:#f2c661;--latebg:#3d3113;--abs:#ff9a9d;--absbg:#431b1d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:12px 16px 96px}
h1{font-size:1.4rem;margin:8px 0 2px}h2{font-size:1.05rem;margin:0}p{margin:0}.mute{color:var(--mute);font-size:.9rem}
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.lang{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;min-height:40px;padding:0 12px;font-weight:700;cursor:pointer}
.back{background:none;border:0;color:var(--brand);font:600 1rem inherit;padding:10px 4px;cursor:pointer}
button{font-family:inherit}
.btn{width:100%;min-height:52px;border-radius:10px;border:2px solid var(--brand);background:var(--brand);color:var(--on);font-weight:700;font-size:1.05rem;cursor:pointer}
.btn.sec{background:transparent;color:var(--brand)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.lesson{display:block;width:100%;text-align:left;padding:14px;margin-top:10px;cursor:pointer;color:inherit;font-size:1rem}
.lesson:disabled{opacity:.6;cursor:default}
.chips{display:flex;gap:8px;margin:12px 0}
.chip{flex:1;padding:8px;border-radius:10px;text-align:center;font-weight:700}.chip small{display:block;font-weight:400}
.ok{background:var(--okbg);color:var(--ok)}.late{background:var(--latebg);color:var(--late)}.abs{background:var(--absbg);color:var(--abs)}
.alert{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px;border-radius:12px;background:var(--latebg);color:var(--late);border:1px solid var(--late);margin-bottom:12px}
.alert button{min-height:44px;padding:0 14px;border-radius:8px;border:2px solid var(--late);background:transparent;color:var(--late);font-weight:700;cursor:pointer}
.row{display:flex;align-items:center;width:100%;gap:10px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;text-align:left;font-size:1rem;cursor:pointer;min-height:56px}
.row:last-child{border-bottom:0}
.av{width:36px;height:36px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none}
.grow{flex:1}.tag{padding:4px 10px;border-radius:999px;font-weight:700;font-size:.85rem;white-space:nowrap}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 16px;max-height:85%;overflow:auto}
.opt{display:flex;width:100%;align-items:center;gap:10px;min-height:52px;padding:10px 12px;margin-top:8px;border-radius:10px;border:1px solid var(--line);background:none;color:inherit;font-size:1rem;cursor:pointer;text-align:left}
.opt.c{justify-content:center;color:var(--brand);font-weight:700}
.snap{height:84px;border-radius:10px;background:repeating-linear-gradient(45deg,var(--line),var(--line) 8px,transparent 8px,transparent 16px);display:grid;place-items:center;color:var(--mute);margin:10px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;display:flex;gap:14px;align-items:center;z-index:9;max-width:92%}
.toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;cursor:pointer;min-height:44px}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px;background:var(--bg);border-top:1px solid var(--line)}.foot>div{max-width:560px;margin:0 auto}
.big{font-size:3rem;text-align:center;margin-top:40px}
</style></head><body><main id="app"></main><div id="layer"></div>
<script>
const TX={en:{
 lessons:"Today's lessons",overview:"Attendance overview",registered:"Checked in",camera:"Camera status",online:"Online",pick:"Pick a lesson to open its attendance register.",active:"Camera active – check-ins arriving",notstarted:"Not started yet",
 lessonsBack:"‹ Lessons",started:"Started",tap:"Tap a student to change their status",
 ok:"On time",late:"Late",abs:"Absent",unrec:"1 face not recognised",entered:"Entered",noentry:"No entry recorded",resolve:"Resolve",
 review:"Review and submit",back:"‹ Back to register",check:"Check before you submit",goes:"Once submitted, the register goes to the school office.",
 unres:"1 face is still unresolved.",unresH:"Assign it or leave it out.",confirm:"Confirm and submit register",
 done:"Register submitted",office:"The school office can now see it.",tolist:"Back to today's lessons",restart:"Restart demo",
 who:"Who entered at",snap:"Camera snapshot,",choose:"Choose the student this face belongs to.",cancel:"Cancel",
 cur:"Current status:",chooseNew:"Choose a new one.",current:"(current)",undo:"Undo",marked:"marked",matched:"Face matched to",
 cam:"Camera active",g:"Group B",l2:"Databases – Group A",cls:"ICT 101 – Group B"},
ru:{
 lessons:"Уроки на сегодня",overview:"Сводка посещаемости",registered:"Отметились",camera:"Статус камеры",online:"В сети",pick:"Выберите урок, чтобы открыть журнал посещаемости.",active:"Камера работает – студенты заходят",notstarted:"Ещё не начался",
 lessonsBack:"‹ Уроки",started:"Начало",tap:"Нажмите на студента, чтобы изменить статус",
 ok:"Вовремя",late:"Опоздал(а)",abs:"Отсутствует",unrec:"1 лицо не распознано",entered:"Вошёл(а)",noentry:"Входа не зафиксировано",resolve:"Указать",
 review:"Проверить и отправить",back:"‹ Назад к журналу",check:"Проверьте перед отправкой",goes:"После отправки журнал уйдёт в учебную часть.",
 unres:"1 лицо всё ещё не определено.",unresH:"Назначьте студента или пропустите.",confirm:"Подтвердить и отправить журнал",
 done:"Журнал отправлен",office:"Теперь его видит учебная часть.",tolist:"К урокам на сегодня",restart:"Начать демо заново",
 who:"Кто вошёл в",snap:"Снимок с камеры,",choose:"Выберите студента, которому принадлежит это лицо.",cancel:"Отмена",
 cur:"Текущий статус:",chooseNew:"Выберите новый.",current:"(текущий)",undo:"Отменить",marked:"— новый статус:",matched:"Лицо сопоставлено:",
 cam:"Камера работает",g:"Группа B",l2:"Базы данных – Группа A",cls:"ICT 101 – Группа B"}};
let lang=localStorage.getItem("presence_lang")||"en";const t=k=>TX[lang][k];
function toggleLanguage(){lang=lang==="en"?"ru":"en";localStorage.setItem("presence_lang",lang);render()}
const START="09:00";
const base=[["Aigerim S.","08:56","ok"],["Bekzat T.","08:58","ok"],["Dana K.","09:07","late"],["Eldar M.","08:59","ok"],["Madina R.","09:12","late"],["Nurlan A.","08:57","ok"],["Sabina Y.",null,"abs"],["Timur Z.",null,"abs"]];
let S;function reset(){S={screen:"lessons",sheet:null,toast:null,unrec:{time:"09:05"},students:base.map((s,i)=>({id:i,name:s[0],time:s[1],status:s[2]}))}}reset();
const $=id=>document.getElementById(id);
const ini=n=>n.split(" ").map(w=>w[0]).join("");
const cnt=k=>S.students.filter(s=>s.status===k).length;const total=()=>S.students.length;const registered=()=>S.students.filter(s=>s.time).length;
function go(s){S.screen=s;S.sheet=null;render();scrollTo(0,0)}
function toast(msg,undo){S.toast={msg,undo};render();clearTimeout(toast.t);toast.t=setTimeout(()=>{S.toast=null;render()},5000)}
function setStatus(i,st){const p=S.students[i],old={...p};p.status=st;if(st==="abs")p.time=null;else if(!p.time)p.time=st==="late"?"09:10":"08:59";S.sheet=null;
 toast(p.name+" "+t("marked")+" "+t(st).toLowerCase()+".",()=>{S.students[i]=old;S.toast=null;render()})}
function assign(i){const p=S.students[i],old={...p};p.time=S.unrec.time;p.status=p.time>START?"late":"ok";S.unrec=null;S.sheet=null;
 toast(t("matched")+" "+p.name+" ("+t(p.status).toLowerCase()+", "+p.time+").",()=>{S.students[i]=old;S.unrec={time:"09:05"};S.toast=null;render()})}
const tag=st=>`<span class="tag ${st}">${t(st)}</span>`;
const chips=()=>`<div class="chips"><div class="chip ok">${cnt("ok")}<small>${t("ok")}</small></div><div class="chip late">${cnt("late")}<small>${t("late")}</small></div><div class="chip abs">${cnt("abs")}<small>${t("abs")}</small></div></div>`;
function render(){
 const a=S.screen;
 let h=`<div class="top"><span>${a==="register"?`<button class="back" onclick="go('lessons')">${t("lessonsBack")}</button>`:a==="review"?`<button class="back" onclick="go('register')">${t("back")}</button>`:""}</span><button class="lang" onclick="toggleLanguage()" aria-label="Language">${lang==="en"?"RU":"EN"}</button></div>`;
 if(a==="lessons")h+=`<h1>${t("lessons")}</h1><p class="mute">${t("pick")}</p>${chips()}
  <div class="card" style="padding:14px;margin-top:10px"><h2>${t("overview")}</h2><p class="mute" style="margin-top:4px">${t("registered")}: ${registered()} / ${total()} · ${t("camera")}: ${t("online")}</p></div>
  <button class="card lesson" onclick="go('register')"><h2>${t("cls")}</h2><p class="mute">09:00 · Room 214 · ${t("active")}</p></button>
  <button class="card lesson" disabled><h2>${t("l2")}</h2><p class="mute">11:00 · Room 108 · ${t("notstarted")}</p></button>`;
 if(a==="register")h+=`<h1>${t("cls")}</h1><p class="mute">${t("started")} ${START} · Room 214 · ${t("tap")}</p>${chips()}`+
  (S.unrec?`<div class="alert" role="alert"><span><b>${t("unrec")}</b><br>${t("entered")} ${S.unrec.time}</span><button onclick="S.sheet='unrec';render()">${t("resolve")}</button></div>`:"")+
  `<div class="card">`+S.students.map((s,i)=>`<button class="row" onclick="S.sheet=${i};render()"><span class="av">${ini(s.name)}</span><span class="grow"><b>${s.name}</b><br><span class="mute">${s.time?t("entered")+" "+s.time:t("noentry")}</span></span>${tag(s.status)}</button>`).join("")+`</div>
  <div class="foot"><div><button class="btn" onclick="go('review')">${t("review")}</button></div></div>`;
 if(a==="review")h+=`<h1>${t("check")}</h1><p class="mute">${t("goes")}</p>${chips()}`+
  (S.unrec?`<div class="alert" role="alert"><span><b>${t("unres")}</b><br>${t("unresH")}</span><button onclick="go('register');S.sheet='unrec';render()">${t("resolve")}</button></div>`:"")+
  `<div class="card">`+S.students.filter(s=>s.status!=="ok").map(s=>`<div class="row" style="cursor:default"><span class="av">${ini(s.name)}</span><span class="grow"><b>${s.name}</b></span>${tag(s.status)}</div>`).join("")+`</div>
  <div class="foot"><div><button class="btn" onclick="go('done')">${t("confirm")}</button></div></div>`;
 if(a==="done")h+=`<div class="big" aria-hidden="true">✓</div><h1 style="text-align:center">${t("done")}</h1><p class="mute" style="text-align:center;margin-bottom:24px">${t("cls")} · ${cnt("ok")} / ${cnt("late")} / ${cnt("abs")}. ${t("office")}</p>
  <button class="btn" onclick="go('lessons')">${t("tolist")}</button><button class="btn sec" style="margin-top:10px" onclick="reset();render()">${t("restart")}</button>`;
 $("app").innerHTML=h;
 let l="";
 if(S.sheet==="unrec")l=`<div class="sheetbg" onclick="if(event.target===this){S.sheet=null;render()}"><div class="sheet" role="dialog"><h2>${t("who")} ${S.unrec.time}?</h2><div class="snap">${t("snap")} ${S.unrec.time}</div><p class="mute">${t("choose")}</p>`+
  S.students.map((s,i)=>s.time?"":`<button class="opt" onclick="assign(${i})"><span class="av">${ini(s.name)}</span>${s.name}</button>`).join("")+`<button class="opt c" onclick="S.sheet=null;render()">${t("cancel")}</button></div></div>`;
 else if(typeof S.sheet==="number"){const s=S.students[S.sheet];
  l=`<div class="sheetbg" onclick="if(event.target===this){S.sheet=null;render()}"><div class="sheet" role="dialog"><h2>${s.name}</h2><p class="mute">${t("cur")} ${t(s.status).toLowerCase()}. ${t("chooseNew")}</p>`+
  ["ok","late","abs"].map(k=>`<button class="opt" onclick="setStatus(${S.sheet},'${k}')" ${k===s.status?'style="border:2px solid var(--brand)"':""}>${tag(k)} ${k===s.status?t("current"):""}</button>`).join("")+`<button class="opt c" onclick="S.sheet=null;render()">${t("cancel")}</button></div></div>`}
 if(S.toast)l+=`<div class="toast" role="status"><span>${S.toast.msg}</span><button onclick="S.toast.undo()">${t("undo")}</button></div>`;
 $("layer").innerHTML=l;
}
render();
</script></body></html>
